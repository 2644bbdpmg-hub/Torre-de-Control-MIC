[build]
  publish = "."

# El histórico sólo cambia cuando se regenera el tablero, así que se cachea fuerte.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
